name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter web build

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter web build
        working-directory: .
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply watchlist --remote
      - name: Sync Worker secrets
        env:
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          jq -n \
            --arg csecret "$GH_OAUTH_CLIENT_SECRET" \
            --arg jwt "$JWT_SECRET" \
            --arg tmdb "$TMDB_API_KEY" \
            '{GITHUB_CLIENT_SECRET:$csecret,JWT_SECRET:$jwt,TMDB_API_KEY:$tmdb}' \
            > secrets.json
          pnpm exec wrangler secret bulk secrets.json
          rm -f secrets.json
      - name: Deploy worker
        run: pnpm exec wrangler deploy
